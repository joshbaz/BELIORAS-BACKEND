services:
  mongodb:
    image: mongo:7
    container_name: belioras-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - belioras-mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: belioras-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - belioras-redis-data:/data

volumes:
  belioras-mongo-data:
  belioras-redis-data: